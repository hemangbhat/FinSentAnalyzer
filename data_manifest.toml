# Data Manifest — Financial Sentiment Analyzer
# This file documents all dataset versions used in this project for reproducibility.
# Update this file whenever datasets are modified or new ones are added.

[primary_dataset]
name = "Financial PhraseBank"
source = "https://huggingface.co/datasets/financial_phrasebank"
paper = "Malo et al. (2014) — Good Debt or Bad Debt: Detecting Semantic Orientations in Economic Texts"
agreement = "AllAgree (100% annotator agreement)"
total_samples = 2264
classes = ["positive", "neutral", "negative"]
class_distribution = { positive = 570, neutral = 1391, negative = 303 }
encoding = "latin-1"
local_path = "data/raw/FinancialPhraseBank-v1.0/Sentences_AllAgree.txt"
splits = { train = 1807, val = 226, test = 226 }
split_strategy = "stratified 80/10/10"
random_seed = 42

[cross_validation_dataset]
name = "Synthetic Financial News Headlines"
source = "Generated locally by external-datasets/financial-news-stock-prediction/generate_dummy_news.py"
synthetic = true
local_path = "external-datasets/financial-news-stock-prediction/data/"
files = ["sample_news.csv", "stock_data.csv", "final_dataset.csv"]
total_headlines = 2688
tickers = ["AAPL", "TSLA", "AMZN"]
# NOTE: headlines are template-generated, not real articles. The `source`
# column (Reuters/Bloomberg/etc.) is a randomly assigned synthetic label, NOT
# the true publisher. This data exists only to exercise the end-to-end pipeline
# (sentiment scoring, aggregation, charting) — it is NOT a real out-of-domain
# generalization benchmark and must not be presented as such.
purpose = "Pipeline demonstration only (synthetic data — not a generalization benchmark)"

[generalization_dataset]
name = "Twitter Financial News Sentiment"
source = "https://huggingface.co/datasets/zeroshot/twitter-financial-news-sentiment"
license = "MIT"
split = "validation"
total_samples = 2388
classes = ["negative", "neutral", "positive"]
local_path = "data/external/real_financial_news.csv"
fetch_command = "python scripts/fetch_real_news_dataset.py"
purpose = "Real, human-labeled out-of-distribution generalization test (valid benchmark)"
label_mapping = "Bearish->negative, Bullish->positive, Neutral->neutral"

[processed_data]
train_path = "data/processed/train.csv"
val_path = "data/processed/val.csv"
test_path = "data/processed/test.csv"
preprocessing = ["regex text cleaning", "lowercasing", "duplicate removal (5 removed)", "null check"]
label_encoding = { negative = 0, neutral = 1, positive = 2 }
