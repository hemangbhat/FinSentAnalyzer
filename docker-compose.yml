# FinSight — split architecture: Streamlit UI ─► nginx load balancer ─► scaled
# FastAPI replicas, with a shared Redis store for rate limiting.
#
#   docker compose up --build --scale api=3
#
# UI:        http://localhost:8501
# API (LB):  http://localhost:8080  (e.g. GET /health, POST /predict)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      # Set a key for a non-public deployment; leave empty for an open demo.
      FINSIGHT_API_KEY: "${FINSIGHT_API_KEY:-}"
      FINSIGHT_REDIS_URL: "redis://redis:6379"
      FINSIGHT_TRUST_PROXY: "true"
    expose:
      - "8000"
    depends_on:
      - redis
    # `--scale api=N` runs N replicas; nginx load-balances across them.

  lb:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Point the UI at the load balancer — predictions run on the API tier.
      FINSIGHT_API_URL: "http://lb:80"
      FINSIGHT_API_KEY: "${FINSIGHT_API_KEY:-}"
    ports:
      - "8501:8501"
    depends_on:
      - lb
