events {}

http {
    # Docker's embedded DNS. Using a variable in proxy_pass (below) forces
    # nginx to re-resolve on each request, so traffic is load-balanced across
    # all scaled `api` replicas rather than pinned to one at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 80;

        # Pass the real client IP through so the API's rate limiter (with
        # FINSIGHT_TRUST_PROXY=true) keys on the actual caller.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
